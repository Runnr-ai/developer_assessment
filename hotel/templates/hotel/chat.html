<html>
  <head>
    <title>Hotel Chat System</title>

    <!-- bootstrap css -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- bootstrap icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- react js -->
    <script
      type="module"
      crossorigin
      src="http://localhost:5173/widget.js"
    ></script>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <!-- Header -->
      <div class="row mb-4">
        <div class="col-12">
          <h1 class="display-4 text-primary mb-3">{{ hotel.name }} Chat</h1>
          <p class="lead text-muted">Frontend Technical Assessment</p>
        </div>
      </div>

      <!-- Main Layout -->
      <div class="row">
        <!-- Guests List -->
        <div class="col-md-3">
        <h5 class="mb-3">Guests</h5>
          {% for guest in all_guests %}
            <a href="#" class="list-group-item list-group-item-action">
              {{ guest.name }}
            </a>
          {% endfor %}
        </div>

        <!-- Guest Details -->
        <div class="col-md-9">
          <h5 class="mb-3">Guest Details</h5>
          <div id="react-widget" class="border rounded p-3 bg-white shadow-sm">
            <!-- Candidate integrates React widget here -->
            <p class="text-muted">Select a guest to see details.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- bootstrap js -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
